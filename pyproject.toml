[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steroids"
version = "0.1.0"
description = "Universal AI Skill Router & Accelerator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
steroids = "steroids.router:main"

[tool.setuptools.packages.find]
where = ["src"]
