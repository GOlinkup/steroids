<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steroids Skill Graph</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
::selection{background:rgba(31,111,235,.4)}
body{margin:0;background:#0b0e14;color:#e6e9f0;font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;border-bottom:1px solid #1e2430;display:flex;gap:12px;align-items:center}
header h1{font-size:15px;margin:0;color:#7ee787;white-space:nowrap}
header .sub{color:#8b949e;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#search{margin-left:auto;background:#11161f;border:1px solid #2a3342;color:#e6e9f0;border-radius:6px;padding:6px 10px;width:220px;font:inherit;transition:border-color .15s,box-shadow .15s}
#search::placeholder{color:#6e7681}
#search:focus{outline:none;border-color:#1f6feb;box-shadow:0 0 0 2px rgba(31,111,235,.35)}
#wrap{flex:1;display:flex;min-height:0}
#canvas{flex:1;display:block;cursor:grab;min-width:0}
#details{width:260px;flex-shrink:0;border-left:1px solid #1e2430;padding:12px 14px;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a3342 transparent}
#details h2{font-size:15px;font-weight:600;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid #1e2430;color:#7ee787;word-break:break-word}
#details p{margin:8px 0}
#details p:first-of-type{color:#8b949e}
#details b{color:#e6e9f0;font-weight:600}
#details .kw{display:inline-block;background:#1a2230;border:1px solid #2a3342;border-radius:5px;padding:2px 8px;margin:2px;font-size:12px;line-height:1.5}
#details .kw:hover{border-color:#3b4763}
#details .dim{color:#8b949e;line-height:1.5}
#details .load{display:block;width:100%;margin:10px 0;padding:8px;border-radius:6px;border:1px solid #1f6feb;background:#12203a;color:#e6e9f0;font:inherit;cursor:pointer}
#details .load:hover{background:#1a2c4f}
#details .nb{color:#8b949e;font-size:12px}
#mascot{width:100%;height:104px;display:block;border-bottom:1px solid #1e2430;cursor:grab;touch-action:none;image-rendering:pixelated}
footer{padding:6px 16px;border-top:1px solid #1e2430;color:#8b949e;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){
header{flex-wrap:wrap;padding:8px 12px;gap:8px}
#search{order:3;flex:1 1 100%;width:auto;margin-left:0}
#wrap{flex-direction:column}
#canvas{min-height:0}
#details{width:auto;border-left:none;border-top:1px solid #1e2430;max-height:34vh;padding:10px 12px}
#details h2{font-size:14px;margin-bottom:8px;padding-bottom:6px}
footer{font-size:11px;padding:5px 12px}
}
#zoom{position:fixed;right:288px;bottom:44px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:34px;height:34px;border-radius:8px;border:1px solid #2a3342;background:#11161f;color:#e6e9f0;font-size:18px;line-height:1;cursor:pointer}
#zoom button:hover{border-color:#1f6feb}
#zoom button:active{transform:scale(.94)}
@media (max-width:700px){#zoom{right:12px;bottom:auto;top:200px}}
</style>
</head>
<body>
<header><h1>Steroids Skill Graph</h1><span class="sub" id="headline"></span><input id="search" placeholder="search skills…"><input id="scrub" type="range" min="0" max="1000" value="1000" title="Scrub routing history" style="width:110px"><span class="sub" id="scrublabel"></span></header>
<canvas id="mascot"></canvas>
<div id="wrap"><canvas id="canvas"></canvas><aside id="details"><p class="dim">Click a node for details.</p></aside></div>
<div id="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button></div>
<footer>drag node to move · scroll or +/− to zoom · drag background to pan · double-click to reset view · drop text to ripple-match</footer>
<script>
var SAMPLE={nodes:[
{id:"frontend-patterns",keywords:["ui","layout","theme","component","react"],degree:3},
{id:"design-system",keywords:["token","palette","typography","spacing","theme"],degree:2},
{id:"react-patterns",keywords:["react","hook","component","state","ui"],degree:3},
{id:"django-patterns",keywords:["django","orm","api","cache","signal"],degree:2},
{id:"fastapi-patterns",keywords:["api","pydantic","async","auth","test"],degree:2},
{id:"postgres-patterns",keywords:["postgres","index","query","schema","api"],degree:2},
{id:"e2e-testing",keywords:["playwright","test","e2e","ci","visual"],degree:2},
{id:"python-testing",keywords:["pytest","test","mock","coverage","fixture"],degree:2},
{id:"code-review",keywords:["review","pr","diff","standard","spec"],degree:1},
{id:"deployment-patterns",keywords:["ci","docker","deploy","health","rollback"],degree:2},
{id:"docker-patterns",keywords:["docker","compose","container","network","deploy"],degree:2},
{id:"canvas",keywords:["canvas","obsidian","mindmap","spatial","graph"],degree:1}],
links:[
{source:"frontend-patterns",target:"react-patterns",weight:2},
{source:"frontend-patterns",target:"design-system",weight:2},
{source:"react-patterns",target:"design-system",weight:2},
{source:"django-patterns",target:"fastapi-patterns",weight:2},
{source:"django-patterns",target:"postgres-patterns",weight:2},
{source:"fastapi-patterns",target:"postgres-patterns",weight:2},
{source:"e2e-testing",target:"python-testing",weight:2},
{source:"e2e-testing",target:"deployment-patterns",weight:2},
{source:"deployment-patterns",target:"docker-patterns",weight:3},
{source:"code-review",target:"deployment-patterns",weight:2}]};
var data=SAMPLE, nodes=[], linkIdx={}, W=800, H=600, view={x:0,y:0,k:1};
var cv=document.getElementById("canvas"), ctx=cv.getContext("2d");
var sel=null, drag=null, panning=null, q="";
function init(){
  nodes=data.nodes.map(function(n,i){var a=i/Math.max(1,data.nodes.length)*6.283;
    return {id:n.id,kw:n.keywords,x:Math.cos(a)*200+Math.random()*40,y:Math.sin(a)*200+Math.random()*40,vx:0,vy:0};});
  linkIdx={}; data.links.forEach(function(l){linkIdx[l.source+"|"+l.target]=l.weight;linkIdx[l.target+"|"+l.source]=l.weight;});
  var GP=(window.GRAPH_POS||{}),hasGP=nodes.length&&nodes.every(function(n){return GP[n.id];});
  if(hasGP){nodes.forEach(function(n){n.x=GP[n.id][0];n.y=GP[n.id][1];});}
  else{for(var t=0;t<60;t++) tick();}
  headline(); fit(); fitView();
}
function deg(id){var d=0;data.links.forEach(function(l){if(l.source===id||l.target===id)d++;});return d;}
function byId(id){for(var i=0;i<nodes.length;i++) if(nodes[i].id===id) return nodes[i];}
function tick(){
  for(var i=0;i<nodes.length;i++){for(var j=i+1;j<nodes.length;j++){
    var a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2),f=Math.min(4000/d2,50);
    a.vx+=dx/d*f;b.vx-=dx/d*f;a.vy+=dy/d*f;b.vy-=dy/d*f;}}
  data.links.forEach(function(l){var a=byId(l.source),b=byId(l.target);if(!a||!b)return;
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+0.01,f=(d-120)*0.02*l.weight;
    a.vx+=dx/d*f;b.vx-=dx/d*f;a.vy+=dy/d*f;b.vy-=dy/d*f;});
  nodes.forEach(function(n){n.vx*=0.85;n.vy*=0.85;n.x+=n.vx;n.y+=n.vy;});
}
function fit(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;
  var dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
function fitView(){ // fit the FULL graph on load / double-click: nobody lands in soup
  if(!nodes.length)return;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,i;
  for(i=0;i<nodes.length;i++){var n=nodes[i];
    if(n.x<x0)x0=n.x;if(n.x>x1)x1=n.x;if(n.y<y0)y0=n.y;if(n.y>y1)y1=n.y;}
  var bw=Math.max(60,x1-x0+160),bh=Math.max(60,y1-y0+120);
  view.x=(x0+x1)/2;view.y=(y0+y1)/2;
  view.k=Math.min(1.5,Math.max(0.3,Math.min(W/bw,H/bh)));
}
function w2s(p){return [(p[0]-view.x)*view.k+W/2,(p[1]-view.y)*view.k+H/2];}
function s2w(p){return [(p[0]-W/2)/view.k+view.x,(p[1]-H/2)/view.k+view.y];}
function match(n){return !q||n.id.toLowerCase().indexOf(q)>-1;}
var SNAP=[], replayOn=false, replaySet={};
// ponytail: F56 session replay — slider scrubs served history, ±1h window lights up.
function applyScrub(frac){if(!SNAP.length)return;replayOn=frac<1;
  var t0=SNAP[0].t,t1=SNAP[SNAP.length-1].t,tc=t0+frac*(t1-t0);
  replaySet={};var n=0;
  SNAP.forEach(function(r){if(Math.abs(r.t-tc)<=3600){if(!replaySet[r.s])n++;replaySet[r.s]=1;}});
  document.getElementById("scrublabel").textContent=n+" active @ "+new Date(tc*1000).toLocaleString();
  draw();}
function draw(){
  ctx.clearRect(0,0,W,H);
  data.links.forEach(function(l){var a=byId(l.source),b=byId(l.target);if(!a||!b)return;
    var p=w2s([a.x,a.y]),s=w2s([b.x,b.y]);
    ctx.strokeStyle="rgba(126,231,135,"+(0.12+0.1*l.weight)+")";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(s[0],s[1]);ctx.stroke();});
  nodes.forEach(function(n){var p=w2s([n.x,n.y]),r=(5+deg(n.id)*1.5)*view.k,m=match(n)&&(!replayOn||replaySet[n.id]);
    ctx.globalAlpha=m?1:0.25;
    ctx.fillStyle=n===sel?"#7ee787":fireColor(n.id);
    ctx.beginPath();ctx.arc(p[0],p[1],r,0,6.283);ctx.fill();
    ctx.fillStyle=m?"#e6e9f0":"#6e7681";ctx.font="11px system-ui,sans-serif";
    if((view.k>=0.8&&view.k<=1.6)||n===sel)ctx.fillText(n.id,p[0]+r+4,p[1]+4);ctx.globalAlpha=1;});
}
var FIRE=null;
function fireColor(id){var c=FIRE?FIRE[id]:0;if(!c)return "#1f6feb";
  // ponytail: F55 served-driven heat — log scale over ~3 decades to orange.
  var t=Math.min(1,Math.log10(1+c)/3);
  return "rgb("+Math.round(31+t*224)+","+Math.round(111+t*11)+","+Math.round(235-t*209)+")";}
function headline(){document.getElementById("headline").textContent=
  "generated from your live index — "+data.nodes.length+" skills";}
function show(n){
  // ponytail: F52 click-to-inject — details against the live index: neighbors
  // + one-click load command (copies `load skill: <id>` for the harness).
  var d=document.getElementById("details"),kws=n.kw.map(function(k){return '<span class="kw">'+k+"</span>";}).join("");
  var nbs=[];data.links.forEach(function(l){if(l.source===n.id)nbs.push(l.target);else if(l.target===n.id)nbs.push(l.source);});
  var nb=nbs.slice(0,8).map(function(id){return '<span class="kw">'+id+"</span>";}).join("")||'<span class="dim">none</span>';
  d.innerHTML="<h2>"+n.id+"</h2><p>degree: <b>"+deg(n.id)+"</b></p><p>"+kws+"</p>"+
    '<button class="load" id="loadbtn">Load skill: '+n.id+"</button>"+
    '<p class="nb">neighbors:<br>'+nb+"</p>";
  document.getElementById("loadbtn").addEventListener("click",function(){
    var cmd="load skill: "+n.id;
    function done(ok){document.getElementById("loadbtn").textContent=ok?"Copied!":"Copy: "+cmd;}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cmd).then(function(){done(true);},function(){done(false);});}
    else{var t=document.createElement("textarea");t.value=cmd;document.body.appendChild(t);t.select();try{document.execCommand("copy");done(true);}catch(e){done(false);}document.body.removeChild(t);}});
}
function hit(mx,my){for(var i=nodes.length-1;i>=0;i--){var p=w2s([nodes[i].x,nodes[i].y]);
  if((p[0]-mx)*(p[0]-mx)+(p[1]-my)*(p[1]-my)<144) return nodes[i];}return null;}
function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
var downAt=null;
cv.addEventListener("mousedown",function(e){var m=pos(e),n=hit(m[0],m[1]);downAt=m;
  if(n){drag=n;}else{panning={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};}cv.style.cursor="grabbing";});
window.addEventListener("mousemove",function(e){
  if(drag){var w=s2w(pos(e));drag.x=w[0];drag.y=w[1];draw();}
  else if(panning){view.x=panning.vx-(e.clientX-panning.x)/view.k;view.y=panning.vy-(e.clientY-panning.y)/view.k;draw();}});
window.addEventListener("mouseup",function(e){
  if(drag&&downAt){var m=pos(e);
    if(Math.abs(m[0]-downAt[0])+Math.abs(m[1]-downAt[1])<4){sel=drag;show(drag);draw();}}
  drag=null;panning=null;cv.style.cursor="grab";});
cv.addEventListener("wheel",function(e){e.preventDefault();
  var m=pos(e),w0=s2w(m);view.k=Math.min(2,Math.max(0.3,view.k*(e.deltaY<0?1.1:0.9)));
  view.x=w0[0]-(m[0]-W/2)/view.k;view.y=w0[1]-(m[1]-H/2)/view.k;draw();},{passive:false});
cv.addEventListener("dblclick",function(){view.x=0;view.y=0;replayOn=false;
  document.getElementById("scrub").value=1000;document.getElementById("scrublabel").textContent="";fitView();draw();});
document.getElementById("scrub").addEventListener("input",function(e){applyScrub(e.target.value/1000);});
// ponytail: F53 drag-a-prompt — drop text, top-5 keyword matches ripple.
function dropScore(text){var seen={},toks=(text||"").toLowerCase().match(/[a-z0-9+#]{3,}/g)||[];
  toks.forEach(function(t){seen[t]=1;});
  return nodes.map(function(n){var s=0;n.kw.forEach(function(k){if(seen[k])s++;});return {n:n,s:s};})
    .filter(function(r){return r.s>0;}).sort(function(a,b){return b.s-a.s;}).slice(0,5);}
var ripples=[];
function ripple(rows){var t0=performance.now();
  ripples=rows.map(function(r){return {n:r.n,t0:t0};});
  sel=rows.length?rows[0].n:null;if(sel)show(sel);
  (function frame(){var now=performance.now(),live=false;draw();
    ripples.forEach(function(r){var pr=(now-r.t0)/1200;if(pr>=1)return;live=true;
      var q=w2s([r.n.x,r.n.y]);ctx.globalAlpha=1-pr;ctx.strokeStyle="#7ee787";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(q[0],q[1],8+pr*46,0,6.283);ctx.stroke();ctx.globalAlpha=1;});
    if(live)requestAnimationFrame(frame);else{ripples=[];draw();}})();}
cv.addEventListener("dragover",function(e){e.preventDefault();});
cv.addEventListener("drop",function(e){e.preventDefault();
  var t=e.dataTransfer?e.dataTransfer.getData("text/plain"):"";if(!t)return;
  var rows=dropScore(t);if(rows.length)ripple(rows);});
function zoomStep(f){var m=[W/2,H/2],w0=s2w(m);
  view.k=Math.min(2,Math.max(0.3,view.k*f));
  view.x=w0[0]-(m[0]-W/2)/view.k;view.y=w0[1]-(m[1]-H/2)/view.k;draw();}
document.getElementById("zin").addEventListener("click",function(){zoomStep(1.25);});
document.getElementById("zout").addEventListener("click",function(){zoomStep(0.8);});
var searchT=null;
document.getElementById("search").addEventListener("input",function(e){q=e.target.value.toLowerCase();
  if(window.Mascot){window.Mascot.think();clearTimeout(searchT);searchT=setTimeout(function(){window.Mascot.idle();},600);}
  draw();});
window.addEventListener("resize",function(){fit();draw();});
init();draw();
if(window.Mascot)window.Mascot.busy();
Promise.all([fetch("skill-graph.json").then(function(r){if(!r.ok)throw 0;return r.json();}),
  fetch("skill-graph.positions.json").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
  fetch("skill-fire.json").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
  fetch("served-snapshot.json").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})]
  ).then(function(ab){var g=ab[0];window.GRAPH_POS=ab[1]||null;FIRE=ab[2]||null;SNAP=ab[3]||[];return g;}).then(function(g){
  if(g&&g.nodes&&g.nodes.length){data={nodes:g.nodes.map(function(n){return {id:n.id,keywords:n.keywords,degree:n.degree||0};}),links:g.links||[]};
    sel=null;document.getElementById("details").innerHTML='<p class="dim">Click a node for details.</p>';
    if(window.Mascot)window.Mascot.busy();
    init();draw();if(window.Mascot)window.Mascot.idle();}}).catch(function(){if(window.Mascot)window.Mascot.idle();});
</script>
<script src="mascot.js"></script>
</body>
</html>
